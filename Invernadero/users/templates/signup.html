{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloraCore - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body>
    <div class="container">
        
        <!-- ============================================== -->
        <!-- SECCIÓN IZQUIERDA: Marca y Decoración (60%) -->
        <!-- ============================================== -->
        <section class="panel-decorativo">
             <!-- Bloque superior de la marca (FloraCore) -->
             <div class="brand-header">
                 <div class="logo-text">FloraCore</div>
             </div>
             
             <!-- Contenido central (Logo y Slogan) -->
             <div class="content-center">
                 <!-- Usamos una imagen de placeholder, ajusta la ruta si es necesario -->
                 <img src="{% static 'img/planta-login.png' %}" class="logo-center" alt="Logo central de FloraCore">
                 
                 <!-- Slogan -->
                 <h2 class="slogan">La mejor opción para tus plantas</h2>
             </div>
        </section>

        <!-- ============================================== -->
        <!-- SECCIÓN DERECHA: Formulario de Registro (40%) -->
        <!-- ============================================== -->
        <form action="{% url 'signup' %}" method="POST" class="form-register">
            
            {% csrf_token %}
            
            <h1 class="titulo-principal">Registro</h1>

    
            
            <div class="form-content">
                
                {% if error %}
                    <p class="error-general">{{ error }}</p>
                {% endif %}
                
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    {{ form.username }}
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    {{ form.email }}
                </div>

                <div class="form-group">
                    <label for="password1">Contraseña</label>
                    {{ form.password1 }}
                </div>

                <div class="form-group">
                    <label for="password2">Confirmar Contraseña</label>
                    {{ form.password2 }}
                </div>
            
                <button type="submit" class="btn-register">Registrarse</button>
            </div>
            
            <div class="opciones">
                <p class="login-text">¿Ya tienes una cuenta? <a href="{% url 'signin' %}" class="link-opcion">Iniciar sesión</a></p>
            </div>
        </form>
    </div>
    <img src="{% static 'img/nashe.png' %}" class="flora" alt="Liana decorativa">
</body>
</html>
