<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - FloraCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn-primary { background: linear-gradient(45deg, #667eea, #764ba2); border: none; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-seedling text-success" style="font-size: 3rem;"></i>
                    <h2 class="mt-3">FloraCore</h2>
                </div>
                
                {% if validlink %}
                    <h4 class="text-center mb-4">Nueva Contraseña</h4>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña:</label>
                            {{ form.new_password1 }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirmar contraseña:</label>
                            {{ form.new_password2 }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-save me-2"></i>Cambiar Contraseña
                        </button>
                    </form>
                {% else %}
                    <div class="text-center">
                        <i class="fas fa-exclamation-triangle text-warning" style="font-size: 2rem;"></i>
                        <h4 class="mt-3">Link Inválido</h4>
                        <p>El enlace de restablecimiento de contraseña no es válido o ha expirado.</p>
                        <a href="/ResetPassword/password_reset/" class="btn btn-primary">
                            <i class="fas fa-arrow-left me-2"></i>Solicitar Nuevo Enlace
                        </a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
